<body class="flex min-h-screen flex-col bg-pg-dark font-trek text-white">

  <!-- The picture: sun, mountains and a road that leads to a "no signal" sign -->
  <div
    class="relative min-h-[320px] flex-[1_1_52vh] overflow-hidden bg-gradient-to-b from-[#fbb62a] via-[#ff9d2e] to-pg-orange"
    aria-hidden="true"
  >
    <!-- clouds -->
    <div class="absolute top-[14%] h-[22px] w-[110px] animate-drift-slow rounded-full bg-white/55 before:absolute before:-top-[14px] before:left-[22%] before:h-7 before:w-[44%] before:rounded-full before:bg-inherit before:content-[''] motion-reduce:animate-none"></div>
    <div class="absolute top-[28%] h-[22px] w-[76px] animate-drift-slower rounded-full bg-white/55 before:absolute before:-top-[14px] before:left-[22%] before:h-7 before:w-[44%] before:rounded-full before:bg-inherit before:content-[''] motion-reduce:animate-none"></div>

    <svg
      class="absolute bottom-0 left-1/2 h-auto w-[max(125%,1100px)] -translate-x-1/2"
      viewBox="-400 0 1600 420"
    >
      <defs>
        <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#ff8a1f" />
          <stop offset="1" stop-color="#ff6a00" />
        </radialGradient>
        <symbol id="tree" viewBox="0 0 28 44">
          <path d="M14 0 L26 22 H18 L28 38 H0 L10 22 H2 Z" />
        </symbol>
      </defs>

      <!-- sun -->
      <circle class="animate-glow [transform-origin:560px_150px] motion-reduce:animate-none" cx="560" cy="150" r="92" fill="url(#sunGrad)" />

      <!-- far mountains -->
      <polygon points="-400,420 -400,230 -250,190 -120,255 0,262 120,170 222,252 330,118 470,262 560,192 680,252 800,200 950,245 1080,185 1200,240 1200,420" fill="#1b7a4b" />
      <!-- snow caps -->
      <polygon points="330,118 292,165 315,156 332,177 350,155 376,166" fill="#fff" />
      <polygon points="120,170 73,206 100,197 120,215 140,198 165,206" fill="#fff" />
      <polygon points="560,192 530,222 548,215 562,230 578,214 596,222" fill="#fff" />

      <!-- front hills -->
      <path d="M-400 420 V320 Q-200 300 0 330 Q150 280 300 322 T600 312 T800 296 Q1000 270 1200 310 V420 Z" fill="#0f3d2a" />

      <!-- the road -->
      <path d="M350 420 C350 385 540 390 485 350 C445 322 365 330 415 300 L425 300 C385 330 470 325 510 352 C575 395 420 392 460 420 Z" fill="#ff7a1a" />
      <path class="animate-dash motion-reduce:animate-none" d="M405 420 C405 392 505 385 478 352 C450 326 400 322 420 302" fill="none" stroke="#fff3df" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 14" />

      <!-- trees -->
      <g fill="#0a2b1e">
        <use href="#tree" x="20" y="300" width="34" height="54" />
        <use href="#tree" x="62" y="318" width="26" height="42" />
        <use href="#tree" x="640" y="300" width="36" height="56" />
        <use href="#tree" x="684" y="322" width="26" height="42" />
        <use href="#tree" x="730" y="296" width="38" height="60" />
        <use href="#tree" x="290" y="338" width="22" height="36" />
        <use href="#tree" x="-250" y="298" width="36" height="58" />
        <use href="#tree" x="-196" y="322" width="26" height="42" />
        <use href="#tree" x="880" y="306" width="34" height="54" />
        <use href="#tree" x="940" y="292" width="40" height="62" />
      </g>

      <!-- foreground hill (same color as the panel below, so they blend) -->
      <path d="M-400 420 V396 Q100 362 420 398 T1200 390 V420 Z" fill="#0f3d2a" />

      <!-- the sign post -->
      <rect x="188" y="318" width="8" height="102" fill="#0a2b1e" />
      <g transform="rotate(-6 192 322)">
        <rect x="130" y="286" width="124" height="46" rx="10" fill="#fff" />
        <text x="192" y="315" text-anchor="middle" font-family="Trebuchet MS, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#0f3d2a">No signal</text>
      </g>
    </svg>
  </div>

  <!-- The message -->
  <main class="-mt-px bg-pg-dark px-6 pb-14 pt-7 text-center">
    <h1 class="mb-3 text-[clamp(2rem,7vw,3rem)] font-extrabold leading-[1.05]">
      You are off the map
    </h1>
    <p class="mx-auto mb-7 max-w-[460px] text-[1.05rem] leading-relaxed text-pg-mint">
      Looks like your connection took a wrong turn. Check your Wi-Fi or mobile
      data, and we will get you back on the road.
    </p>

    <div class="flex flex-wrap justify-center gap-3">
      <button
        id="retry"
        class="cursor-pointer rounded-full border-2 border-pg-orange bg-pg-orange px-7 py-3.5 font-bold text-pg-ink hover:bg-[#ffa04d] focus-visible:outline focus-visible:outline-[3px] focus-visible:outline-offset-[3px] focus-visible:outline-white"
      >
        Try again
      </button>
      <a
        href="/"
        class="rounded-full border-2 border-pg-orange bg-transparent px-7 py-3.5 font-bold text-white no-underline hover:bg-white/10 focus-visible:outline focus-visible:outline-[3px] focus-visible:outline-offset-[3px] focus-visible:outline-white"
      >
        Back to home
      </a>
    </div>

    <div
      class="mt-7 inline-flex items-center gap-2.5 rounded-full bg-pg-deep px-4 py-2 text-[0.92rem] text-pg-mint"
      role="status"
      aria-live="polite"
    >
      <span class="h-2.5 w-2.5 animate-blink rounded-full bg-pg-orange motion-reduce:animate-none"></span>
      <span id="statusText">Waiting for a connection</span>
    </div>
  </main>

  <script>
    var statusText = document.getElementById("statusText");

    // Try again button
    document.getElementById("retry").addEventListener("click", function () {
      if (navigator.onLine) {
        location.reload();
      } else {
        statusText.textContent = "Still offline. Check your Wi-Fi or mobile data.";
      }
    });

    // Reload by itself as soon as the connection comes back
    window.addEventListener("online", function () {
      statusText.textContent = "Back online. Loading...";
      location.reload();
    });
  </script>
</body>
</html>
